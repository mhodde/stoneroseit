<!-- ==========================================
     CONTACTFORMULIER
========================================== -->

<form id="contactForm" novalidate>

    <!-- Naam -->
    <div class="mb-3">

        <label for="naam" class="form-label">
            Naam *
        </label>

        <input
            type="text"
            class="form-control"
            id="naam"
            placeholder="Uw naam"
            required>

    </div>

    <!-- Bedrijf -->
    <div class="mb-3">

        <label for="bedrijf" class="form-label">
            Bedrijf
        </label>

        <input
            type="text"
            class="form-control"
            id="bedrijf"
            placeholder="Bedrijfsnaam">

    </div>

    <!-- Email -->
    <div class="mb-3">

        <label for="email" class="form-label">
            E-mailadres *
        </label>

        <input
            type="email"
            class="form-control"
            id="email"
            placeholder="naam@bedrijf.nl"
            required>

    </div>

    <!-- Onderwerp -->
    <div class="mb-3">

        <label for="onderwerp" class="form-label">
            Onderwerp
        </label>

        <input
            type="text"
            class="form-control"
            id="onderwerp">

    </div>

    <!-- Bericht -->
    <div class="mb-3">

        <label for="bericht" class="form-label">
            Bericht *
        </label>

        <textarea
            id="bericht"
            class="form-control"
            rows="6"
            required></textarea>

    </div>

    <button
        type="submit"
        class="btn btn-success">

        Versturen

    </button>

</form>
